# Builds the book on every push to main and every pull request.
# Pushes to main publish main.pdf to the "Latest build" release:
#   https://github.com/scott-hw/math-book/releases/latest/download/main.pdf
# Pull requests attach the PDF to the workflow run so reviewers can check it.

name: Build PDF

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the older, still-running build.
concurrency:
  group: build-pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to update the release on pushes to main

    steps:
      - uses: actions/checkout@v5

      # Same TeX Live release and packages as README step 2 (BasicTeX is
      # roughly scheme-small). If you add a package there, add it here too.
      - name: Install TeX Live
        uses: zauguin/install-texlive@v4
        with:
          texlive_version: 2026
          packages: >
            scheme-small
            latexmk biblatex biber subfiles
            mathtools amsfonts amsmath amscls minted
            algorithms algorithmicx imakeidx blindtext hyperref
            graphics tools xcolor

      - name: Build the book
        run: latexmk

      - name: Upload the build log if the build failed
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: build-log
          path: main.log

      - name: Attach the PDF to this pull request's run
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v5
        with:
          name: main-pdf
          path: main.pdf

      - name: Publish the PDF to the "Latest build" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest-build
          git push -f origin latest-build
          notes="Built automatically from commit ${GITHUB_SHA::7} on main."
          if gh release view latest-build >/dev/null 2>&1; then
            gh release upload latest-build main.pdf --clobber
            gh release edit latest-build --notes "$notes"
          else
            gh release create latest-build main.pdf --title "Latest build" --notes "$notes" --latest
          fi
